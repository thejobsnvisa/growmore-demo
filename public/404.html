<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>

    <script>
      // Save current path
      sessionStorage.setItem(
        "redirect",
        window.location.pathname + window.location.search
      );

      // Redirect to homepage
      window.location.replace("/");
    </script>
  </head>

  <body>
    Redirecting...
  </body>
</html>
