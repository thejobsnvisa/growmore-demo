name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Installs a stable, modern version of Google Chrome onto the runner
      - name: Setup Chrome Executable
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      # Runs the build sequence, mapping react-snap to the installed Chrome environment
      # Runs the build sequence, mapping react-snap to the installed Chrome environment
      - name: Build
        run: |
          # Enable unprivileged user namespaces on the runner host
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          npm run build
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Force Puppeteer/Chrome to bypass the SUID helper restriction
          PUPPETEER_ARGS: '--no-sandbox --disable-setuid-sandbox'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4